  }
  function mkcard(i){
    const depth=Math.random();
    return{bx:rnd(.02,.98),y:rnd(0,1),rank:i===0?13:1+Math.floor(Math.random()*13),suit:suits[i%4],
      px:rnd(0,6.28),sway:rnd(.4,1.3),fall:rnd(.32,.96),drift:rnd(.02,.05),dr:rnd(.12,.36),
      sc:(.55+depth*.6)*Math.min(1,Math.max(.6,vh/700))*130,a:.18+depth*.42,
      rx:rnd(-.3,.3),ry:rnd(-.9,.9),rz:rnd(-.75,.75),
      vx:rnd(-.08,.08),vy:rnd(-.1,.1),vz:rnd(-.05,.05)};
  }

  function star(x,y,r,fill){
    cx.fillStyle=fill;cx.beginPath();
    cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);
    cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill();
  }

  function drawwave(t){
    const y0=vh*.7,span=vh-y0+60,cols=Math.round(Math.min(90,vw/16)),rows=34;
    for(let r=0;r<rows;r++){
      const d=((r+t*.9)%rows)/rows;
      const dd=Math.pow(d,1.7);
      const y=y0+dd*span;
      const spread=(.22+dd*1.9)*vw*.62;
      for(let c=-cols;c<=cols;c++){
        const gx=c/cols;
        const h=(Math.sin(gx*6+t*.8+d*7)+Math.sin(gx*2.4-t*.5+d*11))*.5;
        const px=vw/2+gx*spread+smx*18*dd;
        const py=y-h*(10+dd*34)*(.4+dd);
        const hh=(h+1)/2;
        const a=(.05+dd*.5)*(.35+hh*.9)*Math.max(0,1-Math.abs(gx)*.95)*Math.min(1,d*6);
        if(a<.02)continue;
        const sz=.5+dd*1.9+hh*.8;
        cx.fillStyle="rgba("+(hh>.7?"255,255,255":"170,176,190")+","+a.toFixed(3)+")";
        cx.fillRect(px-sz/2,py-sz/2,sz,sz);
      }
    }
  }

  function drawcard(c,t){
    const size=c.sc,persp=7;
    const ox=c.bx*vw+Math.sin(t*c.dr+c.px)*c.drift*vw+smx*size*.15;
    const oy=-size*1.2+((c.y*(vh+size*2.4)+t*c.fall*size*.55)%(vh+size*2.4));
    const rx=c.rx+t*c.vx+Math.sin(t*.24*c.sway+c.px)*.07,
          ry=c.ry+t*c.vy+Math.sin(t*.2*c.sway+c.px*1.3)*.08,
          rz=c.rz+t*c.vz+Math.sin(t*.17*c.sway+c.px*.7)*.05;
    const cxr=Math.cos(rx),sxr=Math.sin(rx),cyr=Math.cos(ry),syr=Math.sin(ry),czr=Math.cos(rz),szr=Math.sin(rz);
    function proj(x,y){
      let y1=y*cxr,z1=y*sxr;y=y1;let z=z1;
      let x2=x*cyr+z*syr;z=-x*syr+z*cyr;x=x2;
      let x3=x*czr-y*szr,y3=x*szr+y*czr;
      const k=persp/(persp+z);
      return[ox+x3*size*k,oy-y3*size*k];
    }
    function poly(pts,close){
      cx.beginPath();
      for(let i=0;i<pts.length;i++){const p=proj(pts[i][0],pts[i][1]);i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);}
      if(close)cx.closePath();cx.stroke();
    }
    function rrect(w,h,r){
      const n=[];const hw=w/2,hh=h/2,cs=[[hw-r,hh-r,0],[-hw+r,hh-r,1],[-hw+r,-hh+r,2],[hw-r,-hh+r,3]];
      for(const q of cs)for(let i=0;i<=4;i++){const a=(q[2]+i/4)*1.5708;n.push([q[0]+Math.cos(a)*r,q[1]+Math.sin(a)*r]);}
      poly(n,true);
    }
    function suit(sx,sy,k,flip){
      const f=flip?-1:1,s=shapes[c.suit],map=p=>[sx+p[0]*k,sy+p[1]*k*f];
      if(c.suit==="c"){for(let i=0;i<s.length;i++)poly(s[i].map(map),true);}
      else poly(s.map(map),true);
    }
    cx.lineWidth=1;
    cx.strokeStyle="rgba(235,238,255,"+c.a+")";rrect(1,1.4,.1);
    cx.strokeStyle="rgba(235,238,255,"+c.a*.7+")";rrect(.9,1.3,.07);
    suit(-.34,.56,.16,false);suit(.34,-.56,.16,true);
    if(c.rank===1)suit(0,-.02,.62,false);
    else if(c.rank>10){rrect(.68,1.02,.06);rrect(.58,.9,.05);suit(0,0,.4,false);
      poly([[-.18,.3],[-.18,.4],[-.09,.34],[0,.43],[.09,.34],[.18,.4],[.18,.3]],false);}
    else for(const p of pips[c.rank]){const m=p[2]||1;suit(p[0],p[1],.27*m,p[1]<0);}
  }

  let last=performance.now(),t=0;
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
    smx+=(mx-smx)*.05;smy+=(my-smy)*.05;
    cx.clearRect(0,0,vw,vh);
    for(const s of stars){
      const w=.5+.5*Math.sin(t*s.sp+s.ph),tw=w*w*w;
      star(s.x+smx*s.s*2,s.y+smy*s.s*1.4,s.s*(.35+.75*tw),"rgba("+(s.g?"212,175,55":"255,255,255")+","+(.08+.65*tw).toFixed(3)+")");
    }
    drawwave(t);
    for(const c of cards)drawcard(c,t);
    if(!reduce)requestAnimationFrame(frame);
  }
  addEventListener("resize",resize);
  addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  resize();
  if(reduce){frame(performance.now())}else requestAnimationFrame(frame);
})();</script></body></html>
